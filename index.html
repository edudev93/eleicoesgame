<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urna Eletrônica</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      gap: 20px;
    }

    /* ===== URNA ===== */
    .urna {
      width: 100%;
      max-width: 800px;
      container-type: inline-size;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 3cqw;
      padding: 3cqw;
      background: linear-gradient(180deg, #f7f7f7, #d9d9d9);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25), inset 0 2px 0 #fff;
      border: 1px solid #bbb;
    }

    /* ===== TELA AZUL ===== */
    .tela {
      background: linear-gradient(180deg, #4a90d9, #1f5fb8);
      border: 3px solid #0b3d8a;
      border-radius: 6px;
      padding: 2.5cqw;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 2cqw;
      min-height: 46cqw;
    }

    .tela-titulo {
      font-size: 2.6cqw;
      font-weight: bold;
      letter-spacing: .5px;
      border-bottom: 1px solid rgba(255,255,255,.4);
      padding-bottom: 1cqw;
    }

    .candidatos {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2cqw;
    }

    .cand {
      background: rgba(0,0,0,.18);
      border: 2px solid transparent;
      border-radius: 6px;
      padding: 1.5cqw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1cqw;
      cursor: pointer;
      transition: .2s;
      text-align: center;
    }

    .cand:hover { background: rgba(255,255,255,.18); }
    .cand.sel   { border-color: #ffe600; background: rgba(255,255,255,.25); }
    .cand.ok    { border-color: #3ddc4a; background: rgba(61,220,74,.3); }

    /* 🔥 AQUI ESTÁ A CORREÇÃO DA IMAGEM 🔥 */
    .cand img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1; /* Força o quadrado perfeito */
      object-fit: contain; /* Mostra a imagem INTEIRA sem cortar */
      object-position: center; /* Centraliza a imagem */
      border: 2px solid #fff;
      background: #222; /* Fundo escuro para preencher as bordas vazias */
      border-radius: 4px;
    }

    .cand .nome   { font-size: 2.3cqw; font-weight: bold; line-height: 1.1; }
    .cand .numero { font-size: 4cqw; font-weight: bold; line-height: 1; }

    .tela-msg {
      font-size: 2cqw;
      min-height: 3cqw;
      text-align: center;
    }

    /* ===== TECLADO ===== */
    .teclado {
      background: #2b3340;
      border-radius: 8px;
      padding: 2cqw;
      display: flex;
      flex-direction: column;
      gap: 1.5cqw;
      box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
    }

    .display {
      background: #cfd8e3;
      color: #111;
      border-radius: 4px;
      text-align: center;
      font-size: 4.5cqw;
      font-weight: bold;
      letter-spacing: 1cqw;
      padding: .8cqw;
      min-height: 6cqw;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2cqw;
    }

    .tecla {
      border: none;
      border-radius: 4px;
      background: linear-gradient(180deg, #4a4f58, #2a2e35);
      color: #fff;
      font-size: 3cqw;
      font-weight: bold;
      padding: 1.6cqw 0;
      cursor: pointer;
      box-shadow: 0 2px 0 #111;
      user-select: none;
    }
    .tecla:active { transform: translateY(2px); box-shadow: none; background: #1f2329; }
    .tecla.zero { grid-column: 2; }

    .acoes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2cqw;
      margin-top: .5cqw;
    }

    .acao {
      border: none;
      border-radius: 4px;
      font-size: 1.5cqw;
      font-weight: bold;
      padding: 1.6cqw 0;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,.5);
      user-select: none;
    }
    .acao:active { transform: translateY(2px); box-shadow: none; }
    .branco    { background: #f2f2f2; color: #222; }
    .corrige   { background: #f28c1e; color: #222; }
    .confirma  { background: #2fbf3f; color: #062; }

    /* ===== PAINEL INFERIOR ===== */
    .painel-inferior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 800px;
      padding: 0 10px;
      gap: 12px;
    }

    .candidato-info {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border .2s;
    }
    .candidato-info:hover { border-color: #007bff; }
    .candidato-info:active { transform: scale(0.98); }

    /* Ajuste na mini foto também */
    .foto-mini { 
      width: 50px; 
      height: 50px; 
      object-fit: contain; 
      border-radius: 8px; 
      background: #222; 
    }
    .candidato-texto h2 { font-size: 16px; color: #333; }
    .candidato-texto p  { font-size: 14px; color: #666; font-weight: bold; }
    .candidato-texto span { color: #007bff; font-size: 20px; }

    #resultado {
      font-size: 18px;
      font-weight: bold;
      color: #00aa00;
      text-align: center;
      flex: 1;
    }

    /* =========================================
       📱 AJUSTES EXCLUSIVOS PARA CELULAR (Mobile)
       ========================================= */
    @media (max-width: 650px) {
      body {
        padding: 10px;
        gap: 15px;
      }

      .urna {
        grid-template-columns: 1fr;
        padding: 15px;
        gap: 15px;
      }

      .tela {
        min-height: 70vw;
      }

      .tela-titulo { font-size: 4vw; text-align: center; }
      .cand .nome { font-size: 3.5vw; }
      .cand .numero { font-size: 6vw; }
      .tela-msg { font-size: 3.5vw; }

      .display { font-size: 8vw; min-height: 12vw; }
      .tecla { 
        font-size: 6vw; 
        padding: 4vw 0; 
        border-radius: 8px;
      }
      .acao { 
        font-size: 3.5vw; 
        padding: 4vw 0; 
        border-radius: 8px;
      }
      
      .painel-inferior {
        flex-direction: column;
        gap: 15px;
      }
      .candidato-info { 
        width: 100%; 
        justify-content: center; 
        padding: 15px;
      }
      .foto-mini { width: 60px; height: 60px; }
      .candidato-texto h2 { font-size: 18px; }
      #resultado { margin-top: 10px; font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="urna">
    <div class="tela">
      <div class="tela-titulo">ELEIÇÕES 2028</div>

      <div class="candidatos">
        <div class="cand" id="cand-22" onclick="votar('Flavio Bolsonaro')">
          <img src="img/flavio.png" alt="Flávio Bolsonaro">
          <div class="nome">Flavio Bolsonaro</div>
          <div class="numero">22</div>
        </div>

        <div class="cand" id="cand-13" onclick="votar('Lula')">
          <img src="img/lula.png" alt="Lula">
          <div class="nome">Lula</div>
          <div class="numero">13</div>
        </div>
      </div>

      <div class="tela-msg" id="tela-msg">Digite o número ou clique na foto</div>
    </div>

    <div class="teclado">
      <div class="display" id="display">--</div>

      <div class="grade">
        <button class="tecla" onclick="digitar('1')">1</button>
        <button class="tecla" onclick="digitar('2')">2</button>
        <button class="tecla" onclick="digitar('3')">3</button>
        <button class="tecla" onclick="digitar('4')">4</button>
        <button class="tecla" onclick="digitar('5')">5</button>
        <button class="tecla" onclick="digitar('6')">6</button>
        <button class="tecla" onclick="digitar('7')">7</button>
        <button class="tecla" onclick="digitar('8')">8</button>
        <button class="tecla" onclick="digitar('9')">9</button>
        <button class="tecla zero" onclick="digitar('0')">0</button>
      </div>

      <div class="acoes">
        <button class="acao branco"   onclick="limpar()">BRANCO</button>
        <button class="acao corrige"  onclick="limpar()">CORRIGE</button>
        <button class="acao confirma" onclick="confirmar()">CONFIRMA</button>
      </div>
    </div>
  </div>

  <div class="painel-inferior">
    <div class="candidato-info" onclick="votar('Flavio Bolsonaro')">
      <img class="foto-mini" src="img/flavio.png" alt="Flávio">
      <div class="candidato-texto">
        <h2>Flavio Bolsonaro</h2>
        <p>Votos: <span id="votos-flavio">0</span></p>
      </div>
    </div>

    <div id="resultado"></div>

    <div class="candidato-info" onclick="votar('Lula')">
      <img class="foto-mini" src="img/lula.png" alt="Lula">
      <div class="candidato-texto">
        <h2>Lula</h2>
        <p>Votos: <span id="votos-lula">0</span></p>
      </div>
    </div>
  </div>

  <script>
    const candidatos = {
      "Flavio Bolsonaro": { numero: "22", idVotos: "votos-flavio" },
      "Lula":             { numero: "13", idVotos: "votos-lula" }
    };

    let votos = { "Flavio Bolsonaro": 0, "Lula": 0 };
    let digitado = "";
    let timer = null;

    const display  = document.getElementById('display');
    const telaMsg  = document.getElementById('tela-msg');
    const resultado = document.getElementById('resultado');
    const MSG_PADRAO = 'Digite o número ou clique na foto';

    function vibrar(ms = 50) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    (function carregarVotos() {
      try {
        const salvos = localStorage.getItem('votos');
        if (salvos) {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (candidatos[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(candidatos[nome].idVotos).innerText = dados[nome];
            }
          }
        }
      } catch (e) {}
    })();

    function digitar(n) {
      vibrar(); 
      if (digitado.length >= 2) return;
      digitado += n;
      atualizarDisplay();
    }

    function limpar() {
      vibrar(); 
      digitado = "";
      atualizarDisplay();
    }

    function atualizarDisplay() {
      display.innerText = (digitado + "--").slice(0, 2).split("").join(" ");

      document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel'));
      const nome = nomePorNumero(digitado);

      if (nome) {
        const card = document.getElementById('cand-' + digitado);
        if (card) card.classList.add('sel'); 
        telaMsg.innerText = nome + ' — aperte CONFIRMA';
      } else if (digitado.length === 2) {
        telaMsg.innerText = 'NÚMERO ERRADO — aperte CORRIGE';
      } else {
        telaMsg.innerText = MSG_PADRAO;
      }
    }

    function nomePorNumero(num) {
      for (const nome in candidatos) {
        if (candidatos[nome].numero === num) return nome;
      }
      return null;
    }

    function confirmar() {
      const nome = nomePorNumero(digitado);
      if (nome) votar(nome);
      else vibrar(200); 
    }

    function votar(nomeCandidato) {
      vibrar(100); 
      const info = candidatos[nomeCandidato];

      votos[nomeCandidato]++;
      document.getElementById(info.idVotos).innerText = votos[nomeCandidato];
      try { localStorage.setItem('votos', JSON.stringify(votos)); } catch (e) {}

      document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel', 'ok'));
      const cardVotado = document.getElementById('cand-' + info.numero);
      if (cardVotado) cardVotado.classList.add('ok');
      
      telaMsg.innerText = 'FIM — voto em ' + nomeCandidato;
      resultado.innerText = '✅ Voto confirmado!';

      digitado = "";
      display.innerText = '--';

      clearTimeout(timer);
      timer = setTimeout(() => {
        document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel', 'ok'));
        telaMsg.innerText = MSG_PADRAO;
        resultado.innerText = '';
      }, 3000);
    }

    document.addEventListener('keydown', function(event) {
      if (event.key >= '0' && event.key <= '9') {
        digitar(event.key);
      } else if (event.key === 'Enter') {
        confirmar();
      } else if (event.key === 'Backspace' || event.key === 'Escape') {
        event.preventDefault();
        limpar();
      }
    });
  </script>

</body>
</html>
