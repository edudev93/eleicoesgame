<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container principal da urna */
    .urna-container {
      position: relative;
      width: 100%;
      max-width: 800px;
    }

    .imagem-urna {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* Foto do candidato que vai aparecer na tela da urna */
    #foto-urna {
      position: absolute;
      /* Posição exata do bonequinho cinza na tela azul */
      top: 38.5%; 
      left: 14.5%;
      width: 15.5%;
      height: 38%;
      object-fit: cover; /* Recorta a foto para caber no espaço */
      border-radius: 4px;
      display: none; /* Começa escondida */
      z-index: 10;
      border: 1px solid #fff;
    }

    /* Nome do candidato que aparece na tela da urna */
    #nome-urna {
      position: absolute;
      top: 44%;
      left: 33%;
      width: 25%;
      color: white;
      font-size: 1.2vw; /* Ajusta o tamanho conforme a tela */
      font-weight: bold;
      text-align: left;
      line-height: 1.1;
      display: none; /* Começa escondido */
      z-index: 10;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    /* Botões invisíveis sobre a urna */
    .botao-voto {
      position: absolute;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
      z-index: 5;
    }

    /* Área de clique da Tela Azul (Flávio) */
    .area-tela {
      top: 20%;
      left: 14%;
      width: 42%;
      height: 55%;
    }

    /* Área de clique do Teclado (Lula) */
    .area-teclado {
      top: 25%;
      left: 58%;
      width: 25%;
      height: 45%;
    }

    /* Efeito de hover (opcional, só para ver onde está clicando) */
    .botao-voto:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Área abaixo da urna para as fotos e contadores */
    .painel-inferior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
      padding: 0 20px;
    }

    .candidato-info {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .foto-mini {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    .candidato-texto h2 {
      font-size: 16px;
      color: #333;
      margin-bottom: 5px;
    }

    .candidato-texto p {
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }
    
    .candidato-texto span {
      color: #007bff;
      font-size: 18px;
    }

    #resultado {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #00aa00;
      min-height: 30px;
      text-align: center;
    }

    /* Ajustes para celular */
    @media (max-width: 600px) {
      #nome-urna { font-size: 8px; }
      .painel-inferior { flex-direction: column; gap: 15px; }
      .candidato-info { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="urna-container">
    <!-- Imagem de fundo da urna -->
    <img class="imagem-urna" src="img/urna.png" alt="Urna Eletrônica">
    
    <!-- FOTO E NOME QUE APARECEM NA TELA DA URNA -->
    <img id="foto-urna" src="" alt="Foto do Candidato">
    <div id="nome-urna"></div>

    <!-- Áreas clicáveis -->
    <div class="botao-voto area-tela" onclick="votar('Flavio Bolsonaro', 'img/flavio.png')" title="Votar em Flávio"></div>
    <div class="botao-voto area-teclado" onclick="votar('Lula', 'img/lula.png')" title="Votar em Lula"></div>
  </div>

  <!-- Painel de controle abaixo da urna -->
  <div class="painel-inferior">
    <div class="candidato-info" onclick="votar('Flavio Bolsonaro', 'img/flavio.png')">
      <img class="foto-mini" src="img/flavio.png" alt="Flávio">
      <div class="candidato-texto">
        <h2>Flavio Bolsonaro</h2>
        <p>Votos: <span id="votos-flavio">0</span></p>
      </div>
    </div>

    <div id="resultado"></div>

    <div class="candidato-info" onclick="votar('Lula', 'img/lula.png')">
      <img class="foto-mini" src="img/lula.png" alt="Lula">
      <div class="candidato-texto">
        <h2>Lula</h2>
        <p>Votos: <span id="votos-lula">0</span></p>
      </div>
    </div>
  </div>

  <script>
    let votos = {
      "Flavio Bolsonaro": 0,
      "Lula": 0
    };

    const ids = {
      "Flavio Bolsonaro": "votos-flavio",
      "Lula": "votos-lula"
    };

    // Carrega os votos salvos
    (function carregarVotos() {
      const salvos = localStorage.getItem('votos');
      if (salvos) {
        try {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (ids[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(ids[nome]).innerText = dados[nome];
            }
          }
        } catch (e) {
          console.warn('Erro ao carregar votos salvos:', e);
        }
      }
    })();

    function votar(nomeCandidato, caminhoFoto) {
      // 1. Soma o voto
      votos[nomeCandidato]++;
      document.getElementById(ids[nomeCandidato]).innerText = votos[nomeCandidato];
      
      // 2. Salva no navegador
      localStorage.setItem('votos', JSON.stringify(votos));
      
      // 3. Faz a foto e o nome aparecerem na tela da urna
      const foto = document.getElementById('foto-urna');
      const nome = document.getElementById('nome-urna');
      
      foto.src = caminhoFoto;
      foto.style.display = 'block';
      
      nome.innerText = nomeCandidato;
      nome.style.display = 'block';
      
      // 4. Mostra mensagem de sucesso
      let msg = document.getElementById('resultado');
      msg.innerText = `✅ Voto: ${nomeCandidato}`;
      
      // 5. Depois de 3 segundos, "limpa" a tela da urna (esconde a foto)
      setTimeout(() => {
        foto.style.display = 'none';
        nome.style.display = 'none';
        msg.innerText = '';
      }, 3000);
    }
  </script>

</body>
</html>
