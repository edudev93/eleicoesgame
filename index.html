<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e0e0e0; /* Fundo cinza claro */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Área da Urna */
    .urna-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin-bottom: 30px;
    }

    .imagem-urna {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* Botões invisíveis sobre a urna */
    .botao-voto {
      position: absolute;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
    }

    /* Área da Tela Azul (Flávio) */
    .area-tela {
      top: 22%;
      left: 16%;
      width: 41%;
      height: 50%;
    }

    /* Área do Teclado (Lula) */
    .area-teclado {
      top: 25%;
      left: 58%;
      width: 25%;
      height: 40%;
    }

    /* Efeito ao passar o mouse para você ver onde está clicando */
    .botao-voto:hover {
      background: rgba(255, 255, 255, 0.2);
      border: 2px dashed rgba(0,0,0,0.3);
    }

    /* Seção dos Candidatos (Abaixo da urna) */
    .candidatos-fotos {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .candidato {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .candidato:hover {
      transform: scale(1.05);
    }

    .foto {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 4px solid #444;
      margin-bottom: 10px;
      background-color: #ccc;
    }

    .nome {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .contador {
      font-size: 16px;
      font-weight: bold;
      color: #1a1a2e;
      margin-top: 5px;
    }

    .contador span {
      font-size: 22px;
      color: #007bff;
    }

    #resultado {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #00aa00;
      min-height: 30px;
    }

    /* Responsividade para celular */
    @media (max-width: 600px) {
      .candidatos-fotos { gap: 30px; }
      .foto { width: 90px; height: 90px; }
      .nome { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Área da Urna com os botões clicáveis invisíveis -->
  <div class="urna-container">
    <img class="imagem-urna" src="img/urna.png" alt="Urna Eletrônica">
    
    <!-- Botão invisível na tela da urna -->
    <div class="botao-voto area-tela" onclick="votar('Flavio Bolsonaro')" title="Votar em Flávio"></div>
    
    <!-- Botão invisível no teclado da urna -->
    <div class="botao-voto area-teclado" onclick="votar('Lula')" title="Votar em Lula"></div>
  </div>

  <!-- Fotos e contadores visíveis abaixo da urna -->
  <div class="candidatos-fotos">
    <div class="candidato" onclick="votar('Flavio Bolsonaro')">
      <img class="foto" src="img/flavio.png" alt="Flavio Bolsonaro">
      <div class="nome">Flavio Bolsonaro</div>
      <div class="contador">Votos: <span id="votos-flavio">0</span></div>
    </div>

    <div class="candidato" onclick="votar('Lula')">
      <img class="foto" src="img/lula.png" alt="Lula">
      <div class="nome">Lula</div>
      <div class="contador">Votos: <span id="votos-lula">0</span></div>
    </div>
  </div>

  <div id="resultado"></div>

  <script>
    let votos = {
      "Flavio Bolsonaro": 0,
      "Lula": 0
    };

    const ids = {
      "Flavio Bolsonaro": "votos-flavio",
      "Lula": "votos-lula"
    };

    (function carregarVotos() {
      const salvos = localStorage.getItem('votos');
      if (salvos) {
        try {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (ids[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(ids[nome]).innerText = dados[nome];
            }
          }
        } catch (e) {
          console.warn('Erro ao carregar votos salvos:', e);
        }
      }
    })();

    function votar(nomeCandidato) {
      votos[nomeCandidato]++;
      document.getElementById(ids[nomeCandidato]).innerText = votos[nomeCandidato];
      localStorage.setItem('votos', JSON.stringify(votos));
      
      let msg = document.getElementById('resultado');
      msg.innerText = `✅ Voto computado para: ${nomeCandidato}`;
      
      setTimeout(() => { msg.innerText = ''; }, 2000);
    }
  </script>

</body>
</html>
