<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urna Eletrônica Global</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body { font-family: Arial, sans-serif; background: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 15px; gap: 15px; overflow-x: hidden; }
    
    /* ===== TELA DE ENTRADA (NOME) ===== */
    .tela-login {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #2c3e50; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: white; text-align: center; padding: 20px;
    }
    .tela-login h1 { font-size: 28px; margin-bottom: 20px; color: #f1c40f; }
    .tela-login input {
      padding: 15px; font-size: 18px; border-radius: 8px; border: none; width: 100%; max-width: 300px; margin-bottom: 15px; text-align: center;
    }
    .tela-login button {
      padding: 15px 40px; font-size: 18px; font-weight: bold; background: #2ecc71; color: #000; border: none; border-radius: 8px; cursor: pointer;
    }

    /* ===== HUD ===== */
    .hud { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: #1a252f; color: white; padding: 15px 25px; border-radius: 12px; font-size: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-bottom: 4px solid #e74c3c; }
    .hud .jogador { color: #f1c40f; font-size: 16px; }
    .hud .pontos { color: #2ecc71; }

    /* ===== URNA ===== */
    .urna { width: 100%; max-width: 800px; container-type: inline-size; display: grid; grid-template-columns: 1.7fr 1fr; gap: 3cqw; padding: 3cqw; background: linear-gradient(180deg, #f7f7f7, #d9d9d9); border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.25), inset 0 2px 0 #fff; border: 1px solid #bbb; position: relative; }
    .tela { background: linear-gradient(180deg, #4a90d9, #1f5fb8); border: 3px solid #0b3d8a; border-radius: 6px; padding: 2.5cqw; color: #fff; display: flex; flex-direction: column; gap: 2cqw; min-height: 46cqw; }
    .tela-titulo { font-size: 2.6cqw; font-weight: bold; letter-spacing: .5px; border-bottom: 1px solid rgba(255,255,255,.4); padding-bottom: 1cqw; }
    .candidatos { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; }
    .cand { background: rgba(0,0,0,.18); border: 2px solid transparent; border-radius: 6px; padding: 1.5cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1cqw; cursor: pointer; transition: .1s; text-align: center; }
    .cand:active { transform: scale(0.95); } .cand.sel { border-color: #ffe600; background: rgba(255,255,255,.25); } .cand.ok { border-color: #3ddc4a; background: rgba(61,220,74,.3); }
    .foto-wrapper { width: 100%; aspect-ratio: 1 / 1; background: #222; border: 2px solid #fff; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .foto-wrapper img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
    #cand-22 .foto-wrapper img { transform: scale(1.15); }
    .cand .nome { font-size: 2.3cqw; font-weight: bold; line-height: 1.1; } .cand .numero { font-size: 4cqw; font-weight: bold; line-height: 1; }
    .tela-msg { font-size: 2cqw; min-height: 3cqw; text-align: center; }
    .teclado { background: #2b3340; border-radius: 8px; padding: 2cqw; display: flex; flex-direction: column; gap: 1.5cqw; box-shadow: inset 0 2px 8px rgba(0,0,0,.6); }
    .display { background: #cfd8e3; color: #111; border-radius: 4px; text-align: center; font-size: 4.5cqw; font-weight: bold; letter-spacing: 1cqw; padding: .8cqw; min-height: 6cqw; }
    .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2cqw; }
    .tecla { border: none; border-radius: 4px; background: linear-gradient(180deg, #4a4f58, #2a2e35); color: #fff; font-size: 3cqw; font-weight: bold; padding: 1.6cqw 0; cursor: pointer; box-shadow: 0 2px 0 #111; user-select: none; }
    .tecla:active { transform: translateY(2px); box-shadow: none; background: #1f2329; } .tecla.zero { grid-column: 2; }
    .acoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2cqw; margin-top: .5cqw; }
    .acao { border: none; border-radius: 4px; font-size: 1.5cqw; font-weight: bold; padding: 1.6cqw 0; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.5); user-select: none; }
    .acao:active { transform: translateY(2px); box-shadow: none; } .branco { background: #f2f2f2; color: #222; } .corrige { background: #f28c1e; color: #222; } .confirma { background: #2fbf3f; color: #062; }
    
    /* ===== RANKING ===== */
    .ranking-container {
      width: 100%; max-width: 800px; background: white; border-radius: 12px; padding: 20px; margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .ranking-container h2 { font-size: 22px; color: #333; margin-bottom: 15px; text-align: center; }
    .ranking-container ul { list-style: none; }
    .ranking-container li { padding: 10px; border-bottom: 1px solid #eee; font-size: 18px; color: #333; display: flex; justify-content: space-between; align-items: center; }
    .ranking-container li:last-child { border-bottom: none; }
    .ranking-container .pos { font-weight: bold; color: #e74c3c; width: 40px; display: inline-block; }
    .ranking-container .pts { font-weight: bold; color: #2ecc71; background: #e8f8f5; padding: 4px 10px; border-radius: 20px; }

    @media (max-width: 650px) {
      .hud { font-size: 16px; padding: 10px 15px; }
      .urna { grid-template-columns: 1fr; padding: 15px; gap: 10px; }
      .tela { min-height: 70vw; } .tela-titulo { font-size: 4vw; text-align: center; } .cand .nome { font-size: 3.5vw; } .cand .numero { font-size: 6vw; } .tela-msg { font-size: 3.5vw; margin-top: 5px; }
      .teclado { padding: 10px; gap: 8px; } .display { font-size: 5vw; min-height: 8vw; padding: 4px; letter-spacing: 0.5vw; } .grade { gap: 6px; } .tecla { font-size: 4vw; padding: 2vw 0; border-radius: 6px; } .acoes { gap: 6px; } .acao { font-size: 2.5vw; padding: 2.5vw 0; border-radius: 6px; }
    }
  </style>
</head>
<body>

  <!-- TELA INICIAL PARA COLOCAR O NOME -->
  <div class="tela-login" id="tela-login">
    <h1>🗳️ Urna Global</h1>
    <p style="margin-bottom: 20px;">Digite seu nome para entrar no Ranking:</p>
    <input type="text" id="input-nome" placeholder="Seu nome ou apelido" maxlength="15">
    <button onclick="entrarNoJogo()">ENTRAR E VOTAR</button>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="jogador">👤 <span id="nome-jogador">Visitante</span></div>
    <div class="pontos">🗳️ Votos: <span id="pontos">0</span></div>
  </div>

  <!-- URNA -->
  <div class="urna">
    <div class="tela">
      <div class="tela-titulo">ELEIÇÕES 2028</div>
      <div class="candidatos">
        <div class="cand" id="cand-22" onclick="votar('Flavio Bolsonaro')">
          <div class="foto-wrapper"><img src="img/flavio.png" alt="Flávio Bolsonaro"></div>
          <div class="nome">Flavio Bolsonaro</div>
          <div class="numero">22</div>
        </div>
        <div class="cand" id="cand-13" onclick="votar('Lula')">
          <div class="foto-wrapper"><img src="img/lula.png" alt="Lula"></div>
          <div class="nome">Lula</div>
          <div class="numero">13</div>
        </div>
      </div>
      <div class="tela-msg" id="tela-msg">Clique para votar!</div>
    </div>

    <div class="teclado">
      <div class="display" id="display">--</div>
      <div class="grade">
        <button class="tecla" onclick="digitar('1')">1</button><button class="tecla" onclick="digitar('2')">2</button><button class="tecla" onclick="digitar('3')">3</button>
        <button class="tecla" onclick="digitar('4')">4</button><button class="tecla" onclick="digitar('5')">5</button><button class="tecla" onclick="digitar('6')">6</button>
        <button class="tecla" onclick="digitar('7')">7</button><button class="tecla" onclick="digitar('8')">8</button><button class="tecla" onclick="digitar('9')">9</button>
        <button class="tecla zero" onclick="digitar('0')">0</button>
      </div>
      <div class="acoes">
        <button class="acao branco" onclick="limpar()">BRANCO</button>
        <button class="acao corrige" onclick="limpar()">CORRIGE</button>
        <button class="acao confirma" onclick="confirmar()">CONFIRMA</button>
      </div>
    </div>
  </div>

  <!-- PLACAR GLOBAL -->
  <div class="ranking-container">
    <h2>🏆 Top 10 (Quem mais votou)</h2>
    <ul id="lista-ranking">
      <li>Carregando ranking...</li>
    </ul>
  </div>

  <!-- FIREBASE V13 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7vYemf1hXvd4Gz0QAH4v51fTFTsY6vXs",
      authDomain: "jogo-da-urna.firebaseapp.com",
      databaseURL: "https://jogo-da-urna-default-rtdb.firebaseio.com",
      projectId: "jogo-da-urna",
      storageBucket: "jogo-da-urna.firebasestorage.app",
      messagingSenderId: "673785263455",
      appId: "1:673785263455:web:756558d636d77749d6f2ea"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Variáveis do Jogo
    const candidatos = { "Flavio Bolsonaro": { numero: "22" }, "Lula": { numero: "13" } };
    let digitado = "";
    let pontos = 0;
    let nomeJogador = "";
    let idJogador = ""; // Identificador único para o banco de dados

    // --- TELA DE LOGIN ---
    window.entrarNoJogo = function() {
      const input = document.getElementById('input-nome').value.trim();
      if (input === "") {
        alert("Por favor, digite um nome para entrar no ranking!");
        return;
      }
      
      nomeJogador = input;
      // Cria um ID único baseado no nome (remove acentos e espaços)
      idJogador = nomeJogador.toLowerCase().replace(/[^a-z0-9]/g, "_");
      
      document.getElementById('nome-jogador').innerText = nomeJogador;
      document.getElementById('tela-login').style.display = "none";
      
      // Busca os votos atuais desse jogador no Firebase
      carregarMeusVotos();
    }

    // Pressionar Enter no input de nome também entra
    document.getElementById('input-nome').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') window.entrarNoJogo();
    });

    // --- LÓGICA DE VOTAÇÃO ---
    window.votar = function(nomeCandidato) {
      if (navigator.vibrate) navigator.vibrate(40); 
      
      // Atualiza a tela
      pontos += 1; 
      document.getElementById('pontos').innerText = pontos;
      
      const info = candidatos[nomeCandidato];
      document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel', 'ok'));
      document.getElementById('cand-' + info.numero).classList.add('ok');
      
      document.getElementById('tela-msg').innerText = '✅ +1 Voto!'; 
      digitado = ""; 
      document.getElementById('display').innerText = '--';
      
      setTimeout(() => { 
        document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel', 'ok')); 
        document.getElementById('tela-msg').innerText = 'Clique para votar!'; 
      }, 200);

      // Salva no Firebase
      salvarVotosNoBanco();
    }

    window.digitar = function(n) { 
      if (navigator.vibrate) navigator.vibrate(); 
      if (digitado.length >= 2) return; 
      digitado += n; 
      atualizarDisplay(); 
    }

    window.limpar = function() { 
      if (navigator.vibrate) navigator.vibrate(); 
      digitado = ""; 
      atualizarDisplay(); 
    }

    function atualizarDisplay() {
      document.getElementById('display').innerText = (digitado + "--").slice(0, 2).split("").join(" ");
      document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel'));
      const nome = nomePorNumero(digitado);
      if (nome) { 
        document.getElementById('cand-' + digitado).classList.add('sel'); 
        document.getElementById('tela-msg').innerText = 'Aperte CONFIRMA!'; 
      } else if (digitado.length === 2) { 
        document.getElementById('tela-msg').innerText = 'ERRO — CORRIGE'; 
      } else { 
        document.getElementById('tela-msg').innerText = 'Digitando...'; 
      }
    }

    function nomePorNumero(num) { 
      for (const nome in candidatos) { if (candidatos[nome].numero === num) return nome; } 
      return null; 
    }

    window.confirmar = function() { 
      const nome = nomePorNumero(digitado); 
      if (nome) window.votar(nome); 
      else if (navigator.vibrate) navigator.vibrate(100); 
    }

    // --- BANCO DE DADOS FIREBASE ---
    
    // Salva a quantidade de votos do jogador
    function salvarVotosNoBanco() {
      if (!idJogador) return;
      // Salva o nome exato e a quantidade de votos
      set(ref(db, 'ranking/' + idJogador), {
        nome: nomeJogador,
        votos: pontos
      });
    }

    // Carrega os votos que o jogador já tinha (caso ele recarregue a página)
    function carregarMeusVotos() {
      const meuRef = ref(db, 'ranking/' + idJogador);
      onValue(meuRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.votos) {
          pontos = data.votos;
          document.getElementById('pontos').innerText = pontos;
        }
      }, { onlyOnce: true });
    }

    // Atualiza o Top 10 em tempo real
    const rankingRef = query(ref(db, 'ranking'), orderByChild('votos'), limitToLast(10));
    
    onValue(rankingRef, (snapshot) => {
      const listaHTML = document.getElementById('lista-ranking');
      listaHTML.innerHTML = "";
      
      if (!snapshot.exists()) {
        listaHTML.innerHTML = "<li>Nenhum voto registrado ainda. Seja o 1º!</li>";
        return;
      }
      
      const rankingArray = [];
      snapshot.forEach((childSnapshot) => { 
        rankingArray.push(childSnapshot.val()); 
      });
      
      // Inverte para o maior ficar em 1º
      rankingArray.reverse(); 

      rankingArray.forEach((jogador, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span><span class="pos">${index + 1}º</span> ${jogador.nome}</span> 
          <span class="pts">${jogador.votos} votos</span>
        `;
        listaHTML.appendChild(li);
      });
    });

    // Atalhos de teclado
    document.addEventListener('keydown', function(event) {
      if (document.getElementById('tela-login').style.display !== 'none') return;
      if (event.key >= '0' && event.key <= '9') window.digitar(event.key);
      else if (event.key === 'Enter') window.confirmar();
      else if (event.key === 'Backspace' || event.key === 'Escape') { event.preventDefault(); window.limpar(); }
    });
  </script>
</body>
</html>
