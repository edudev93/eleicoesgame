<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .urna-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      container-type: inline-size; /* permite usar cqw (largura do container) nas fontes */
    }

    .imagem-urna {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* ===== TELA AZUL DA URNA (foto + nome juntos) ===== */
    #tela-urna {
      position: absolute;
      /* Se precisar, ajuste só estes 4 valores */
      top: 37.5%;
      left: 30.5%;
      width: 28%;
      height: 34%;

      display: none;
      align-items: center;
      gap: 4%;
      padding: 3%;
      z-index: 20;
      overflow: hidden;
      background: linear-gradient(180deg, #4a90d9, #1f5fb8);
      border: 2px solid #0b3d8a;
      pointer-events: none; /* não atrapalha os cliques */
    }

    #tela-urna.ativa {
      display: flex;
    }

    #foto-urna {
      height: 100%;
      width: 42%;
      object-fit: cover;
      object-position: top center;
      border: 2px solid white;
      background: #333;
      flex-shrink: 0;
    }

    #nome-urna {
      flex: 1;
      color: white;
      font-weight: bold;
      font-size: 2.6cqw;
      line-height: 1.15;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    /* ===== ÁREAS CLICÁVEIS INVISÍVEIS ===== */
    .botao-voto {
      position: absolute;
      cursor: pointer;
      z-index: 10;
    }

    /* Tela azul -> Flávio */
    .area-tela {
      top: 37.5%;
      left: 30.5%;
      width: 28%;
      height: 34%;
    }

    /* Teclado -> Lula */
    .area-teclado {
      top: 42%;
      left: 61%;
      width: 28%;
      height: 33%;
    }

    .botao-voto:hover {
      border: 2px dashed red;
      background: rgba(255, 0, 0, 0.1);
    }

    /* ===== PAINEL INFERIOR ===== */
    .painel-inferior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-top: 30px;
      padding: 0 10px;
    }

    .candidato-info {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border 0.2s;
    }

    .candidato-info:hover {
      border: 2px solid #007bff;
    }

    .foto-mini {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    .candidato-texto h2 {
      font-size: 16px;
      color: #333;
    }

    .candidato-texto p {
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }

    .candidato-texto span {
      color: #007bff;
      font-size: 20px;
    }

    #resultado {
      font-size: 18px;
      font-weight: bold;
      color: #00aa00;
      text-align: center;
    }

    @media (max-width: 600px) {
      .painel-inferior { flex-direction: column; gap: 15px; }
      .candidato-info { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="urna-container">
    <!-- Imagem de fundo -->
    <img class="imagem-urna" src="img/urna.png" alt="Urna Eletrônica">

    <!-- Tela azul: foto + nome ficam juntos aqui dentro -->
    <div id="tela-urna">
      <img id="foto-urna" src="" alt="Foto do Candidato">
      <div id="nome-urna"></div>
    </div>

    <!-- Zonas de clique -->
    <div class="botao-voto area-tela" onclick="votar('Flavio Bolsonaro', 'img/flavio.png')" title="Clique aqui para votar no Flávio"></div>
    <div class="botao-voto area-teclado" onclick="votar('Lula', 'img/lula.png')" title="Clique aqui para votar no Lula"></div>
  </div>

  <!-- Painel com as fotos e contadores -->
  <div class="painel-inferior">
    <div class="candidato-info" onclick="votar('Flavio Bolsonaro', 'img/flavio.png')">
      <img class="foto-mini" src="img/flavio.png" alt="Flávio">
      <div class="candidato-texto">
        <h2>Flavio Bolsonaro</h2>
        <p>Votos: <span id="votos-flavio">0</span></p>
      </div>
    </div>

    <div id="resultado"></div>

    <div class="candidato-info" onclick="votar('Lula', 'img/lula.png')">
      <img class="foto-mini" src="img/lula.png" alt="Lula">
      <div class="candidato-texto">
        <h2>Lula</h2>
        <p>Votos: <span id="votos-lula">0</span></p>
      </div>
    </div>
  </div>

  <script>
    let votos = {
      "Flavio Bolsonaro": 0,
      "Lula": 0
    };

    const ids = {
      "Flavio Bolsonaro": "votos-flavio",
      "Lula": "votos-lula"
    };

    let timer = null;

    (function carregarVotos() {
      try {
        const salvos = localStorage.getItem('votos');
        if (salvos) {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (ids[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(ids[nome]).innerText = dados[nome];
            }
          }
        }
      } catch (e) {
        console.warn('Erro ao carregar votos salvos:', e);
      }
    })();

    function votar(nomeCandidato, caminhoFoto) {
      // Soma o voto e atualiza o contador
      votos[nomeCandidato]++;
      document.getElementById(ids[nomeCandidato]).innerText = votos[nomeCandidato];
      try {
        localStorage.setItem('votos', JSON.stringify(votos));
      } catch (e) {}

      const tela = document.getElementById('tela-urna');
      const foto = document.getElementById('foto-urna');
      const nome = document.getElementById('nome-urna');
      const msg  = document.getElementById('resultado');

      // Mostra foto e nome dentro da tela azul
      foto.src = caminhoFoto;
      nome.innerText = nomeCandidato;
      tela.classList.add('ativa');
      msg.innerText = '✅ Voto confirmado!';

      // Se votar de novo antes dos 3s, reinicia o tempo
      clearTimeout(timer);
      timer = setTimeout(() => {
        tela.classList.remove('ativa');
        msg.innerText = '';
      }, 3000);
    }
  </script>

</body>
</html>
