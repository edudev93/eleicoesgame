<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .urna-container {
      position: relative;
      width: 100%;
      max-width: 800px;
    }

    .imagem-urna {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* FOTO DO CANDIDATO SOBREPOSTA */
    #foto-urna {
      position: absolute;
      /* Posição ajustada para cobrir o bonequinho cinza */
      top: 36%; 
      left: 14%;
      width: 18%;  /* Um pouco maior para garantir visibilidade */
      height: 44%;
      object-fit: cover;
      border-radius: 4px;
      display: none; /* Escondida no início */
      z-index: 999;  /* Fica na frente de absolutamente tudo */
      border: 3px solid white;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background-color: #333; /* Fundo escuro caso a foto seja transparente */
    }

    /* NOME DO CANDIDATO SOBREPOSTO */
    #nome-urna {
      position: absolute;
      top: 42%;
      left: 34%;
      width: 25%;
      color: white;
      font-size: 1.5vw; 
      font-weight: bold;
      text-align: left;
      line-height: 1.1;
      display: none;
      z-index: 999;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* ÁREAS CLICÁVEIS INVISÍVEIS */
    .botao-voto {
      position: absolute;
      cursor: pointer;
      z-index: 10;
    }

    /* Área de clique da Tela Azul (Votar Flávio) */
    .area-tela {
      top: 25%;
      left: 15%;
      width: 40%;
      height: 55%;
    }

    /* Área de clique do Teclado (Votar Lula) */
    .area-teclado {
      top: 25%;
      left: 58%;
      width: 30%;
      height: 45%;
    }

    /* Se você passar o mouse e ver um contorno vermelho tracejado, é o botão ali */
    .botao-voto:hover {
      border: 2px dashed red;
      background: rgba(255, 0, 0, 0.1);
    }

    /* PAINEL DE CONTROLE EMBAIXO */
    .painel-inferior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-top: 30px;
      padding: 0 10px;
    }

    .candidato-info {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border 0.2s;
    }

    .candidato-info:hover {
      border: 2px solid #007bff;
    }

    .foto-mini {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    .candidato-texto h2 {
      font-size: 16px;
      color: #333;
    }

    .candidato-texto p {
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }
    
    .candidato-texto span {
      color: #007bff;
      font-size: 20px;
    }

    #resultado {
      font-size: 18px;
      font-weight: bold;
      color: #00aa00;
      text-align: center;
    }

    @media (max-width: 600px) {
      #nome-urna { font-size: 10px; }
      .painel-inferior { flex-direction: column; gap: 15px; }
      .candidato-info { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="urna-container">
    <!-- Imagem de fundo -->
    <img class="imagem-urna" src="img/urna.png" alt="Urna Eletrônica">
    
    <!-- Elementos que vão aparecer por cima da imagem -->
    <img id="foto-urna" src="" alt="Foto do Candidato">
    <div id="nome-urna"></div>

    <!-- Zonas de Clique -->
    <div class="botao-voto area-tela" onclick="votar('Flavio Bolsonaro', 'img/flavio.png')" title="Clique aqui para votar no Flávio"></div>
    <div class="botao-voto area-teclado" onclick="votar('Lula', 'img/lula.png')" title="Clique aqui para votar no Lula"></div>
  </div>

  <!-- Painel com as fotos e contadores -->
  <div class="painel-inferior">
    <div class="candidato-info" onclick="votar('Flavio Bolsonaro', 'img/flavio.png')">
      <img class="foto-mini" src="img/flavio.png" alt="Flávio">
      <div class="candidato-texto">
        <h2>Flavio Bolsonaro</h2>
        <p>Votos: <span id="votos-flavio">0</span></p>
      </div>
    </div>

    <div id="resultado"></div>

    <div class="candidato-info" onclick="votar('Lula', 'img/lula.png')">
      <img class="foto-mini" src="img/lula.png" alt="Lula">
      <div class="candidato-texto">
        <h2>Lula</h2>
        <p>Votos: <span id="votos-lula">0</span></p>
      </div>
    </div>
  </div>

  <script>
    let votos = {
      "Flavio Bolsonaro": 0,
      "Lula": 0
    };

    const ids = {
      "Flavio Bolsonaro": "votos-flavio",
      "Lula": "votos-lula"
    };

    (function carregarVotos() {
      const salvos = localStorage.getItem('votos');
      if (salvos) {
        try {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (ids[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(ids[nome]).innerText = dados[nome];
            }
          }
        } catch (e) {
          console.warn('Erro ao carregar votos salvos:', e);
        }
      }
    })();

    function votar(nomeCandidato, caminhoFoto) {
      // Soma o voto e atualiza contador
      votos[nomeCandidato]++;
      document.getElementById(ids[nomeCandidato]).innerText = votos[nomeCandidato];
      localStorage.setItem('votos', JSON.stringify(votos));
      
      // Pega os elementos da tela
      const foto = document.getElementById('foto-urna');
      const nome = document.getElementById('nome-urna');
      const msg = document.getElementById('resultado');
      
      // Mostra a foto e o nome na tela da urna
      foto.src = caminhoFoto;
      foto.style.display = 'block';
      
      nome.innerText = nomeCandidato;
      nome.style.display = 'block';
      
      msg.innerText = `✅ Voto confirmado!`;
      
      // Depois de 3 segundos, volta a tela ao normal
      setTimeout(() => {
        foto.style.display = 'none';
        nome.style.display = 'none';
        msg.innerText = '';
      }, 3000);
    }
  </script>

</body>
</html>
