<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #e0e0e0; /* Fundo cinza claro para destacar a urna branca */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container que segura a imagem e os botões sobrepostos */
    .urna-container {
      position: relative;
      width: 100%;
      max-width: 800px; /* Tamanho máximo da urna na tela */
    }

    .imagem-urna {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* 
      Áreas clicáveis invisíveis 
      Você pode ajustar o top, left, width e height em % para encaixar perfeitamente na sua imagem.
      Fiz uma estimativa baseada na imagem que você enviou.
    */
    .botao-voto {
      position: absolute;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      font-weight: bold;
    }

    /* Área da Tela Azul (Flávio) */
    .area-tela {
      top: 38%;
      left: 13%;
      width: 33%;
      height: 40%;
    }

    /* Área do Teclado (Lula) */
    .area-teclado {
      top: 38%;
      left: 58%;
      width: 25%;
      height: 40%;
    }

    .botao-voto:hover {
      background: rgba(255, 255, 255, 0.15); /* Brilho sutil ao passar o mouse */
      border: 2px dashed rgba(255,255,255,0.5);
    }

    /* Contador que aparece em cima do botão */
    .contador-oculto {
      position: absolute;
      bottom: -40px; /* Joga o contador para baixo da urna para não tampar a imagem */
      font-size: 18px;
      color: #333;
      text-shadow: none;
      width: 100%;
      text-align: center;
      white-space: nowrap;
    }

    #resultado {
      position: absolute;
      bottom: -80px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #1a1a2e;
    }

    /* Responsividade para celular */
    @media (max-width: 600px) {
      .contador-oculto { font-size: 12px; bottom: -30px; }
      #resultado { font-size: 16px; bottom: -60px; }
    }
  </style>
</head>
<body>

  <div class="urna-container">
    <!-- Aqui entra a sua imagem (lembre-se de salvar como urna.png na pasta img) -->
    <img class="imagem-urna" src="img/urna.png" alt="Urna Eletrônica">

    <!-- Área clicável em cima da Tela Azul -->
    <div class="botao-voto area-tela" onclick="votar('Flavio Bolsonaro')">
      <!-- Contador exibido logo abaixo da urna -->
      <div class="contador-oculto">Votos Flávio: <span id="votos-flavio" style="color: #00d4ff;">0</span></div>
    </div>

    <!-- Área clicável em cima do Teclado -->
    <div class="botao-voto area-teclado" onclick="votar('Lula')">
      <div class="contador-oculto">Votos Lula: <span id="votos-lula" style="color: #00ff88;">0</span></div>
    </div>

    <!-- Mensagem de confirmação -->
    <div id="resultado"></div>
  </div>

  <script>
    let votos = {
      "Flavio Bolsonaro": 0,
      "Lula": 0
    };

    const ids = {
      "Flavio Bolsonaro": "votos-flavio",
      "Lula": "votos-lula"
    };

    (function carregarVotos() {
      const salvos = localStorage.getItem('votos');
      if (salvos) {
        try {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (ids[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(ids[nome]).innerText = dados[nome];
            }
          }
        } catch (e) {
          console.warn('Erro ao carregar votos salvos:', e);
        }
      }
    })();

    function votar(nomeCandidato) {
      votos[nomeCandidato]++;
      document.getElementById(ids[nomeCandidato]).innerText = votos[nomeCandidato];
      localStorage.setItem('votos', JSON.stringify(votos));
      
      let msg = document.getElementById('resultado');
      msg.innerText = `✅ Voto computado para: ${nomeCandidato}`;
      
      // Efeito para a mensagem sumir depois de 2 segundos
      setTimeout(() => { msg.innerText = ''; }, 2000);
    }
  </script>

</body>
</html>
