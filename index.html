<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 28px;
    }

    .candidatos {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: #16213e;
      border: 3px solid #444;
      border-radius: 16px;
      padding: 30px 20px;
      width: 240px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      user-select: none;
      /* Flexbox para centralizar todo o conteúdo do card */
      display: flex;
      flex-direction: column;
      align-items: center; 
    }

    .card:hover {
      transform: scale(1.05);
      border-color: #00d4ff;
    }

    .card:active {
      transform: scale(0.97);
      background: #0f3460;
    }

    /* Ajuste na imagem para centralizar e padronizar */
    .foto {
      width: 160px;           /* Aumentei um pouco para ficar mais imponente */
      height: 160px;          /* Força ser um quadrado perfeito */
      object-fit: cover;      /* Corta as sobras sem distorcer o rosto */
      object-position: center;/* Garante que o centro da foto fique no meio do círculo */
      border-radius: 50%;
      border: 4px solid #00d4ff;
      margin-bottom: 20px;
      display: block;
      background-color: #0f3460; /* Fundo escuro caso a imagem tenha transparência */
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .contador {
      margin-top: 15px;
      font-size: 16px;
      color: #00ff88;
      font-weight: bold;
      text-align: center;
    }

    .contador .numero {
      font-size: 28px;
      display: block;
      color: #00d4ff;
    }

    #resultado {
      margin-top: 40px;
      font-size: 22px;
      min-height: 40px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .candidatos {
        gap: 20px;
      }
      .card {
        width: 100%;
        max-width: 300px;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <h1>🗳️ Vote no seu candidato</h1>

  <div class="candidatos">
    <div class="card" onclick="votar('Flavio Bolsonaro')">
      <img class="foto" src="img/flavio.png" alt="Flavio Bolsonaro">
      <div class="nome">Flavio Bolsonaro</div>
      <div class="contador">
        Votos: <span class="numero" id="votos-flavio">0</span>
      </div>
    </div>

    <div class="card" onclick="votar('Lula')">
      <img class="foto" src="img/lula.png" alt="Lula">
      <div class="nome">Lula</div>
      <div class="contador">
        Votos: <span class="numero" id="votos-lula">0</span>
      </div>
    </div>
  </div>

  <div id="resultado"></div>

  <script>
    let votos = {
      "Flavio Bolsonaro": 0,
      "Lula": 0
    };

    const ids = {
      "Flavio Bolsonaro": "votos-flavio",
      "Lula": "votos-lula"
    };

    (function carregarVotos() {
      const salvos = localStorage.getItem('votos');
      if (salvos) {
        try {
          const dados = JSON.parse(salvos);
          for (const nome in dados) {
            if (ids[nome]) {
              votos[nome] = dados[nome];
              document.getElementById(ids[nome]).innerText = dados[nome];
            }
          }
        } catch (e) {
          console.warn('Erro ao carregar votos salvos:', e);
        }
      }
    })();

    function votar(nomeCandidato) {
      votos[nomeCandidato]++;
      document.getElementById(ids[nomeCandidato]).innerText = votos[nomeCandidato];
      localStorage.setItem('votos', JSON.stringify(votos));
      document.getElementById('resultado').innerText = `✅ Voto registrado em: ${nomeCandidato}`;
    }
  </script>

</body>
</html>
